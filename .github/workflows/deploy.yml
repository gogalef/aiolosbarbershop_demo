# Builds the site and publishes dist/ to GitHub Pages on every push to main,
# and every Monday morning to pick up new Google reviews.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # never fails. SearchApi requests are spent only by the Monday run and "Run workflow";
      # a push reuses the reviews already on the live site.
      - name: Fetch Google reviews
        run: npm run reviews
        env:
          # SERPAPI_KEY is the name the secret was first saved under
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY || secrets.SERPAPI_KEY }}
          SEARCHAPI_DATA_ID: ${{ vars.SEARCHAPI_DATA_ID }}
          REVIEWS_REFRESH: ${{ github.event_name != 'push' }}
          REVIEWS_FALLBACK_URL: ${{ steps.pages.outputs.base_url }}/assets/reviews.json

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
