# ─────────────────────────────────────────────────────────────
#  SERVICES & PRICES  —  this is the only file you need to edit
# ─────────────────────────────────────────────────────────────
#
#  How it works:
#    - A line starting with "- category:" starts a new group.
#    - Each "- name:" under "services:" is one service.
#    - price:    just the number (20 becomes €20 on the site).
#                You can also write text, e.g.  price: from 15
#    - duration: free text, e.g.  30 min
#
#  Rules (please keep them, otherwise the build will stop and tell you where):
#    - Keep the spaces at the start of lines exactly as they are.
#      Use spaces, not Tab.
#    - If a name contains ": " or " #", put it in double quotes:
#          name: "Cut: classic"
#    - Lines starting with # are comments and are ignored.
#
#  The order here is the order on the site
#  (on wide screens: two columns, left → right, top → bottom).

